name: Daily Roblox Tracker

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas matplotlib

      - name: Run script
        run: python tracker.py

      - name: Commit and push changes to CSV
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Update daily player count log'
          file_pattern: 'player_comparison_log.csv'
